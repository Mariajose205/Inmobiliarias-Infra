# docker compose del FRONTEND que usa el EC2 del frontend (54.156.18.1).
# - nginx: solo entrega los archivos estaticos del bundle de Vite.
# - caddy : termina TLS (Let's Encrypt) en 80/443 delante de nginx.
#
# El frontend ya NO hace de proxy hacia el backend. El navegador llama
# directamente al API Gateway de AWS y el CORS lo resuelve la propia API, asi
# que este compose no necesita la variable API_GATEWAY_URL.
services:

  frontend:
    image: mariacarrero/inmobiliarias-frontend:latest
    container_name: inmobiliarias-frontend
    restart: unless-stopped
    environment:
      TZ: America/Santiago
    expose:
      - "80"
    networks:
      - frontend-red

  caddy:
    image: caddy:2-alpine
    container_name: inmobiliarias-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Subdominio DuckDNS generado desde el .env (ej: inmobiliariasduoc.duckdns.org)
      SITENAME: ${SITENAME}
      TZ: America/Santiago
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - frontend-red

networks:
  frontend-red:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: