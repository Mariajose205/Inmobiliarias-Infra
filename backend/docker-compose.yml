# docker compose del BACKEND que usa el EC2 de backend.
# Las imagenes llegan desde Docker Hub, subidas por GitHub Actions.
#
# Ya NO existe el servicio api-gateway: la API vive en AWS como API Gateway
# (HTTP API) y es la unica que entra al microservicio. Ver
# backend/aws/api-gateway.yaml.
#
# El .env se genera automaticamente en el deploy (backend/.env.template +
# secretos de GitHub). No se guarda aqui.
services:

  db:
    image: postgres:16-alpine
    container_name: inmobiliarias-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Santiago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inmob-red

  # RabbitMQ: broker del flujo de informes (exchange fanout + direct, colas y
  # DLQ). El 5672 (AMQP) queda interno a la red del compose; el 15672 (consola)
  # se publica para administracion y conviene restringirlo por Security Group.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: inmobiliarias-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      TZ: America/Santiago
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inmob-red

  # Servidor SMTP de captura. Reemplazar por un SMTP real (SES, etc.) en un
  # entorno productivo real; aqui permite ver los correos en http://<EC2>:8025.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: inmobiliarias-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - inmob-red

  # Kafka en modo KRaft (sin Zookeeper): broker del flujo de lista de deseos
  # (wishlist-service). El puerto 9092 NO se publica al host: solo lo consumen
  # los otros contenedores por la red interna inmob-red. Asi el broker no queda
  # expuesto aunque el Security Group del EC2 sea permisivo.
  #
  # Nota: en la imagen apache/kafka, si se define cualquier variable KAFKA_* hay
  # que declarar el juego completo de configuracion requerida; por eso estan
  # todas las claves del modo combinado (broker + controller).
  kafka:
    image: apache/kafka:3.9.0
    container_name: inmobiliarias-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      # Obligatorio en modo KRaft: la imagen aborta con "CLUSTER_ID environment
      # variable not set" si falta. Es un UUID base64 fijo del cluster, no un
      # secreto; debe mantenerse igual entre reinicios y despliegues.
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_PROCESS_ROLES: broker,controller
      # No usar 0.0.0.0 en los listeners: en KRaft el listener CONTROLLER se
      # hereda como advertised cuando no se declara, y Kafka rechaza el
      # arranque con "advertised.listeners cannot use the nonroutable
      # meta-address 0.0.0.0". Con "://:puerto" Kafka escucha en todas las
      # interfaces y anuncia el hostname del contenedor.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Limita el heap para que Kafka quepa junto a los dos microservicios,
      # PostgreSQL y RabbitMQ en un EC2 pequeno.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      TZ: America/Santiago
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inmob-red

  # IMPORTANTE: el puerto 8081 se publica para que API Gateway lo alcance por el
  # VPC Link, pero NO debe quedar abierto a internet. El Security Group del EC2
  # debe permitir el puerto 8081 solo desde el VPC Link / NLB y desde la VPC, y
  # nunca desde 0.0.0.0/0. El microservicio tampoco aplica CORS: el unico
  # cliente legitimo es API Gateway.
  #
  # Para atar el puerto a la IP privada del EC2 en vez de a todas sus
  # interfaces, reemplazar el bind por:
  #   - "${BACKEND_PRIVATE_IP}:8081:8081"
  inmobiliaria-service:
    image: mariacarrero/inmobiliaria-service:latest
    container_name: inmobiliaria-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Identidad y rol que el microservicio usa para la matriz de permisos.
      # La autenticacion del token la hace API Gateway.
      # Se usa ${VAR:-default}: si el secreto de GitHub no esta configurado, el
      # .env queda con la variable VACIA y Spring tomaria "" (ignorando el
      # default de application-prod.yml), dejando a admin/corredor sin rol y
      # provocando 403. Con ":-" el compose usa el default cuando esta vacia.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-administrador@inmobiliariaduoc.onmicrosoft.com}
      ADMIN_OID: ${ADMIN_OID:-5ce11c6e-c796-41eb-b8ed-1872878cd197}
      CORREDOR_EMAIL: ${CORREDOR_EMAIL:-Corredor@InmobiliariaDuoc.onmicrosoft.com}
      CORREDOR_OID: ${CORREDOR_OID:-0a73de94-2722-4221-836c-bd7f3af16980}
      # Conexion al broker y al SMTP dentro de la red del compose.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      # Kafka: el microservicio publica el evento "propiedad creada" que consume
      # wishlist-service para generar novedades y alertas por comuna.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      INFORMES_DIR: /app/informes
      TZ: America/Santiago
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      # service_started (no service_healthy): el microservicio arranca aunque el
      # broker tarde o falle, porque reintenta la conexion en segundo plano. Asi
      # un problema de RabbitMQ no tumba el catalogo ni la API.
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - inmob-red

  # Microservicio de lista de deseos (favoritos, alertas y novedades).
  #
  # El puerto 8082 se publica para que el NLB interno de wishlist (creado por
  # backend/aws/api-gateway.yaml del repo de codigo) lo alcance por el VPC Link.
  # Sin este contenedor el target group queda unhealthy y API Gateway responde
  # 503 Service Unavailable en todas las rutas /api/wishlist/*.
  #
  # El Security Group del EC2 debe permitir TCP 8082 desde el CIDR de la VPC
  # (igual que el 8081). Nunca desde 0.0.0.0/0.
  wishlist-service:
    image: mariacarrero/wishlist-service:latest
    container_name: wishlist-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Comparte la base PostgreSQL con inmobiliaria-service; Hibernate crea sus
      # propias tablas (favoritos, alertas_comuna, novedades) con ddl-auto=update.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      # Identidad con la que se resuelve el rol ADMIN/CORREDOR/PUBLIC.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-administrador@inmobiliariaduoc.onmicrosoft.com}
      ADMIN_OID: ${ADMIN_OID:-5ce11c6e-c796-41eb-b8ed-1872878cd197}
      CORREDOR_EMAIL: ${CORREDOR_EMAIL:-Corredor@InmobiliariaDuoc.onmicrosoft.com}
      CORREDOR_OID: ${CORREDOR_OID:-0a73de94-2722-4221-836c-bd7f3af16980}
      TZ: America/Santiago
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      # service_started: el consumidor de Kafka reintenta la conexion si el
      # broker aun no esta listo, y asi un fallo de Kafka no impide que el
      # microservicio arranque y responda el resto de sus endpoints.
      kafka:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - inmob-red

  # UI de administracion de Kafka (topics, particiones, consumer groups y
  # mensajes en vivo). Escucha en el 8080 del host y NO tiene autenticacion
  # propia: el Security Group del EC2 debe permitir el 8080 SOLO desde la IP
  # del administrador (My IP), nunca 0.0.0.0/0.
  #
  # El heap esta limitado porque este EC2 tambien corre PostgreSQL, RabbitMQ,
  # Kafka y los dos microservicios en ~2 GB de RAM.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: inmobiliarias-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: inmobiliarias
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xmx192m -Xms64m"
      TZ: America/Santiago
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - inmob-red

networks:
  inmob-red:
    driver: bridge

volumes:
  pgdata:
  rabbitmqdata:
  kafka-data:
