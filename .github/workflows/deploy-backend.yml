name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Generar .env con los secretos
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_OID: ${{ secrets.ADMIN_OID }}
          CORREDOR_EMAIL: ${{ secrets.CORREDOR_EMAIL }}
          CORREDOR_OID: ${{ secrets.CORREDOR_OID }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          # Se conservan por compatibilidad; el auth actual es el JWT de Azure
          # Entra ID validado por API Gateway (no requieren JWT_SECRET).
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          envsubst < backend/.env.template > backend/.env
          echo ".env generado (el chmod lo aplica el servidor)"

      - name: Copiar docker-compose y .env al EC2 backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_BACKEND }}
          username: ${{ secrets.SSH_USER_BACKEND }}
          key: ${{ secrets.SSH_PRIVATE_KEY_BACKEND }}
          port: 22
          
          source: "backend/"
          strip_components: 1
          target: "/opt/inmobiliarias/backend"

      - name: Levantar/actualizar servicios
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_BACKEND }}
          username: ${{ secrets.SSH_USER_BACKEND }}
          key: ${{ secrets.SSH_PRIVATE_KEY_BACKEND }}
          port: 22
          
          script: |
            cd /opt/inmobiliarias/backend
            chmod 600 .env
            sudo docker compose -p backend pull
            sudo docker compose -p backend up -d
            echo "--- estado ---"
            sudo docker compose -p backend ps